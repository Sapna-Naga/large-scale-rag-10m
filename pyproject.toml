[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "large-scale-rag-10m"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["qdrant-client>=1.12,<2", "fastembed>=0.4,<1", "sentence-transformers>=3,<6", "httpx>=0.27,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "prometheus-client>=0.20,<1", "psutil>=6,<8"]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[project.scripts]
rag = "rag_system.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
